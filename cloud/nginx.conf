user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # 10 GB Maximum Upload Limit for 4K Medical Video Lectures & Course Materials
    client_max_body_size 10G;
    client_body_timeout 1800s;
    client_header_timeout 1800s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream frappe-backend {
        server frappe:8000 fail_timeout=0;
    }

    upstream frappe-socketio {
        server frappe:9000 fail_timeout=0;
    }

    server {
        listen 80;
        server_name _;

        # Static assets direct serving
        location /assets {
            alias /home/frappe/frappe-bench/sites/assets;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Real-time WebSockets
        location /socket.io {
            proxy_pass http://frappe-socketio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Main Frappe LMS Application
        location / {
            proxy_pass http://frappe-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
