<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Midad Academy LMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        darkbg: '#0b1120',
                        darkcard: '#151f32',
                        darkborder: '#1e293b',
                        lightbg: '#f0f4f8',
                        lightcard: '#ffffff'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 13.5px; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        html.dark body { background-color: #0b1120; color: #f1f5f9; }
        html.dark .login-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }
        html.dark .input-field {
            background-color: #151f32;
            border: 1px solid #334155;
            color: #ffffff;
        }

        html.light body { background-color: #f0f4f8; color: #0f172a; }
        html.light .login-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
        }
        html.light .input-field {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }
        html.light .text-white { color: #0f172a !important; }
        html.light .text-slate-400 { color: #64748b !important; }
        html.light .text-slate-300 { color: #334155 !important; }
        html.light .border-slate-800 { border-color: #e2e8f0 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased transition-colors duration-200">

    <!-- Guest Top Header -->
    <header class="border-b border-slate-800 transition-colors duration-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="./index.html" class="flex items-center space-x-3 group">
                <div class="w-9 h-9 rounded-xl bg-[#0A1128] border border-amber-500/40 p-0.5 flex items-center justify-center shadow-md shadow-amber-500/20 group-hover:scale-105 transition overflow-hidden">
                    <img src="./static/images/midad_logo.svg" alt="Midad Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <span class="text-base font-bold tracking-tight text-white block leading-tight">Midad Academy LMS</span>
                    <span class="text-[10px] text-amber-500 font-medium">Academic & Clinical Portal</span>
                </div>
            </a>

            <div class="flex items-center space-x-4 text-xs">
                <a href="./index.html" class="text-slate-300 hover:text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-compass text-slate-400"></i> Explore Courses
                </a>
                <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-400 hover:text-amber-400 transition cursor-pointer" title="Toggle Theme">
                    <i class="fa-solid fa-sun" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Frappe-Style Auth Card -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-sm sm:max-w-md login-card rounded-2xl p-6 sm:p-8 space-y-5 transition-all">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-[#0A1128] border border-amber-500/40 p-1 flex items-center justify-center mx-auto shadow-lg shadow-amber-500/20">
                    <img src="./static/images/midad_logo.svg" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight" id="auth-title">Sign In</h1>
                    <p class="text-xs text-slate-400" id="auth-subtitle">Welcome! Please sign in to continue.</p>
                </div>
            </div>

            <!-- Tab Switcher (Sign In / Create Account) -->
            <div class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl text-xs">
                <button type="button" onclick="switchAuthTab('signin')" id="tab-signin" class="w-1/2 py-1.5 rounded-lg font-bold bg-blue-600 text-white transition cursor-pointer">
                    Sign In
                </button>
                <button type="button" onclick="switchAuthTab('signup')" id="tab-signup" class="w-1/2 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition cursor-pointer">
                    Create Account
                </button>
            </div>

            <!-- Real Error & Alert Box -->
            <div id="auth-alert" class="hidden p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

            <!-- 1. SIGN IN FORM -->
            <form id="signin-form" onsubmit="handleSignIn(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input type="email" id="signin-email" required placeholder="e.g. omardohim@gmail.com or student email" class="w-full pl-9 pr-3 py-2 rounded-xl input-field focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-slate-300 font-medium">Password</label>
                        <a href="javascript:void(0)" onclick="switchAuthTab('forgot')" class="text-[11px] text-blue-400 hover:text-blue-300">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="signin-password" required placeholder="••••••••" class="w-full pl-9 pr-10 py-2 rounded-xl input-field focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="button" onclick="togglePasswordVisibility('signin-password', 'eye-signin')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 cursor-pointer">
                            <i class="fa-regular fa-eye" id="eye-signin"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="signin-submit-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-md shadow-blue-600/30 transition flex items-center justify-center gap-2 cursor-pointer">
                        Continue
                    </button>
                </div>

                <div class="pt-2 text-center">
                    <button type="button" onclick="alert('Magic link dispatch: If an account exists, login link sent to your inbox.')" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium transition cursor-pointer">
                        Login with Email Link
                    </button>
                </div>
            </form>

            <!-- 2. CREATE ACCOUNT (SIGN UP) FORM -->
            <form id="signup-form" onsubmit="handleSignUp(event)" class="hidden space-y-3.5 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Full Name</label>
                    <input type="text" id="signup-name" required placeholder="e.g. Dr. Sarah Al-Omari" class="w-full px-3 py-2 rounded-xl input-field">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="e.g. sarah@midad.edu" class="w-full px-3 py-2 rounded-xl input-field">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Create Password</label>
                    <input type="password" id="signup-password" required minlength="6" placeholder="At least 6 characters" class="w-full px-3 py-2 rounded-xl input-field">
                </div>
                <div class="pt-2">
                    <button type="submit" id="signup-submit-btn" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow-md shadow-emerald-600/30 transition cursor-pointer">
                        Register Student Account
                    </button>
                </div>
            </form>

            <!-- 3. FORGOT PASSWORD FORM -->
            <form id="forgot-form" onsubmit="handleForgot(event)" class="hidden space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Your Email Address</label>
                    <input type="email" id="forgot-email" required placeholder="you@example.com" class="w-full px-3 py-2 rounded-xl input-field">
                </div>
                <div class="pt-1 flex flex-col gap-2">
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition cursor-pointer">
                        Send Reset Link
                    </button>
                    <button type="button" onclick="switchAuthTab('signin')" class="text-slate-400 hover:text-white text-center text-[11px] py-1 cursor-pointer">
                        Back to sign in
                    </button>
                </div>
            </form>

        </div>
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-slate-500 text-xs">
        &copy; 2026 Midad Academy LMS. Academic Management System.
    </footer>

    <!-- Database & Auth Script -->
    <script src="./static/db.js"></script>
    <script>
    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }

    function switchAuthTab(tab) {
        const signinForm = document.getElementById('signin-form');
        const signupForm = document.getElementById('signup-form');
        const forgotForm = document.getElementById('forgot-form');
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const title = document.getElementById('auth-title');
        const subtitle = document.getElementById('auth-subtitle');

        document.getElementById('auth-alert').classList.add('hidden');

        if (tab === 'signup') {
            signinForm.classList.add('hidden');
            forgotForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            tabSignup.className = 'w-1/2 py-1.5 rounded-lg font-bold bg-blue-600 text-white transition';
            tabSignin.className = 'w-1/2 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition';
            title.innerText = 'Create Student Account';
            subtitle.innerText = "Register to access medical cohorts and inter-lecture quizzes.";
        } else if (tab === 'forgot') {
            signinForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            forgotForm.classList.remove('hidden');
            title.innerText = 'Forgot Password';
            subtitle.innerText = "Enter your email, we'll send a password reset link.";
        } else {
            signupForm.classList.add('hidden');
            forgotForm.classList.add('hidden');
            signinForm.classList.remove('hidden');
            tabSignin.className = 'w-1/2 py-1.5 rounded-lg font-bold bg-blue-600 text-white transition';
            tabSignup.className = 'w-1/2 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition';
            title.innerText = 'Sign In';
            subtitle.innerText = 'Welcome! Please sign in to continue.';
        }
    }

    function showAlert(msg, isError = true) {
        const alertBox = document.getElementById('auth-alert');
        alertBox.className = isError
            ? 'p-3 rounded-xl text-xs font-semibold bg-rose-950/60 border border-rose-800/60 text-rose-300 flex items-center gap-2'
            : 'p-3 rounded-xl text-xs font-semibold bg-emerald-950/60 border border-emerald-800/60 text-emerald-300 flex items-center gap-2';
        alertBox.innerHTML = '<i class="fa-solid ' + (isError ? 'fa-triangle-exclamation' : 'fa-circle-check') + '"></i> <span>' + msg + '</span>';
        alertBox.classList.remove('hidden');
    }

    // Strict Authentication Validation
    function handleSignIn(e) {
        e.preventDefault();
        const email = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value.trim();
        const btn = document.getElementById('signin-submit-btn');

        if (!email || !password) {
            showAlert('Please enter both email address and password.');
            return;
        }

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
        btn.disabled = true;

        setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = 'Continue';

            const result = MidadDB.authenticate(email, password);

            if (!result.success) {
                showAlert(result.message, true);
                return;
            }

            // Authentication succeeded!
            showAlert('Authentication successful. Redirecting...', false);

            setTimeout(() => {
                if (result.user.role === 'admin') {
                    // Omar Duhaim goes to the Creator Studio
                    window.location.href = './studio.html';
                } else {
                    // All students go to the dedicated Student Platform
                    window.location.href = './student.html';
                }
            }, 400);

        }, 400);
    }

    // Real Account Registration
    function handleSignUp(e) {
        e.preventDefault();
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value.trim();
        const btn = document.getElementById('signup-submit-btn');

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';
        btn.disabled = true;

        setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = 'Register Student Account';

            const result = MidadDB.register(name, email, password);

            if (!result.success) {
                showAlert(result.message, true);
                return;
            }

            showAlert('Account created successfully! Redirecting to student portal...', false);
            setTimeout(() => {
                window.location.href = './student.html';
            }, 500);

        }, 400);
    }

    function handleForgot(e) {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        if (!email) return;
        alert('If an account exists with ' + email + ', a password reset link has been dispatched.');
        switchAuthTab('signin');
    }

    // Theme Switcher
    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.classList.contains('dark');
        if (isDark) {
            html.classList.remove('dark');
            html.classList.add('light');
            localStorage.setItem('midad_theme', 'light');
        } else {
            html.classList.remove('light');
            html.classList.add('dark');
            localStorage.setItem('midad_theme', 'dark');
        }
        updateThemeUI();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const icon = document.getElementById('theme-icon');
        if (icon) {
            icon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-blue-600';
        }
    }

    function initTheme() {
        const saved = localStorage.getItem('midad_theme') || 'dark';
        if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
        }
        updateThemeUI();
    }

    initTheme();
    </script>
</body>
</html>
