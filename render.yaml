services:
  - type: web
    name: midad-academy-lms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir lms_app app:app --bind 0.0.0.0:$PORT --timeout 600
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
