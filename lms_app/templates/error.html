{% extends "base.html" %}

{% block title %}{{ title or "Error" }} - {{ settings.site_name }}{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-16">
    <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-rose-900/40 text-center shadow-2xl space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center text-2xl border border-rose-500/30">
            {% if error_code == 403 %}
                <i class="fa-solid fa-ban"></i>
            {% else %}
                <i class="fa-solid fa-triangle-exclamation"></i>
            {% endif %}
        </div>

        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <p class="text-sm text-slate-400 leading-relaxed">{{ message }}</p>

        <div class="pt-4">
            <a href="{{ url_for('index') }}" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-lg shadow-blue-500/30 transition inline-flex items-center gap-2">
                <i class="fa-solid fa-house"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
