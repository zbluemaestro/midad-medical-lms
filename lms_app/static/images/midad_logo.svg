<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1F3D"/>
      <stop offset="100%" stop-color="#070D1E"/>
    </radialGradient>

    <!-- Rich Golden Crescent Gradient -->
    <linearGradient id="goldCrescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Golden Brown Pen Body Gradient -->
    <linearGradient id="penBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Flowing Wavy Golden Brown Ink Gradient -->
    <linearGradient id="wavyInk" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Metallic Gold Highlight -->
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Dark Blue Emblem Canvas -->
  <circle cx="200" cy="200" r="185" fill="url(#navyBg)" stroke="url(#goldCrescent)" stroke-width="3" filter="url(#subtleShadow)"/>

  <!-- Concentric Delicate Scientific Orbit Ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6,8"/>

  <!-- ======================================================== -->
  <!-- 1. The Golden & Golden-Brown Crescent                    -->
  <!-- ======================================================== -->
  <path d="M 235 60
           C 130 60, 65 145, 65 240
           C 65 315, 115 365, 185 365
           C 255 365, 310 310, 315 255
           C 260 295, 185 285, 145 240
           C 105 195, 120 120, 235 60 Z"
        fill="url(#goldCrescent)"
        filter="url(#goldGlow)"
        opacity="0.98"/>

  <!-- Crescent Inner Metallic Ridge -->
  <path d="M 230 75
           C 140 85, 88 155, 88 235
           C 88 285, 120 335, 175 348
           C 130 315, 110 260, 130 205
           C 150 150, 180 100, 230 75 Z"
        fill="url(#goldGleam)"
        opacity="0.45"/>

  <!-- ======================================================== -->
  <!-- 2. Wavy Golden-Brown Ink Line (Flowing from the nib)     -->
  <!-- ======================================================== -->
  <!-- Base Primary Ink Wave -->
  <path d="M 215 242
           C 190 265, 160 280, 125 275
           C 85 270, 75 220, 110 200
           C 150 180, 205 195, 255 185
           C 305 175, 335 130, 310 100
           C 290 75, 250 85, 235 110"
        fill="none"
        stroke="url(#wavyInk)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Secondary Dynamic Wave Ribbon -->
  <path d="M 215 242
           C 240 270, 280 295, 325 280
           C 365 265, 360 220, 320 205
           C 270 190, 230 210, 180 225
           C 140 235, 105 230, 85 210"
        fill="none"
        stroke="url(#goldCrescent)"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.65"/>

  <!-- Fluid Ink Droplet Accents -->
  <circle cx="320" cy="205" r="4.5" fill="#F59E0B" filter="url(#goldGlow)"/>
  <circle cx="110" cy="200" r="3.2" fill="#D97706"/>
  <circle cx="330" cy="282" r="2.5" fill="#FDE68A"/>

  <!-- ======================================================== -->
  <!-- 3. Golden & Golden-Brown Fountain Pen / Nib              -->
  <!-- ======================================================== -->
  <!-- Rotated at 35 degrees aiming dynamically downward-left   -->
  <g transform="translate(250, 195) rotate(-35)">
    <!-- Pen Barrel / Upper Body -->
    <path d="M -16 -120 L 16 -120 L 14 -30 L -14 -30 Z" fill="#78350F" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="-14" y="-120" width="28" height="6" fill="#FDE68A"/>

    <!-- Gold Accent Ring -->
    <rect x="-16" y="-30" width="32" height="8" rx="2" fill="url(#goldCrescent)" stroke="#FFFBEB" stroke-width="0.8"/>

    <!-- Fountain Pen Section Collar -->
    <path d="M -13 -22 L 13 -22 L 11 0 L -11 0 Z" fill="#92400E" stroke="#D97706" stroke-width="1"/>

    <!-- Nib Shoulder & Tines (Main Golden Nib) -->
    <path d="M -11 0
             C -14 15, -20 25, -22 40
             C -24 55, -12 70, 0 95
             C 12 70, 24 55, 22 40
             C 20 25, 14 15, 11 0 Z"
          fill="url(#penBody)"
          stroke="#FFFBEB"
          stroke-width="1.5"
          filter="url(#subtleShadow)"/>

    <!-- Nib Center Slit & Breather Hole -->
    <line x1="0" y1="95" x2="0" y2="42" stroke="#070D1E" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="40" r="4" fill="#070D1E" stroke="#FDE68A" stroke-width="1"/>

    <!-- Engraved Decorative Filigree on Nib -->
    <path d="M -10 32 C -4 45, 0 55, 0 65 C 0 55, 4 45, 10 32" fill="none" stroke="#FDE68A" stroke-width="1.2" opacity="0.85"/>
    <path d="M -14 42 C -8 52, 0 62, 0 75 C 0 62, 8 52, 14 42" fill="none" stroke="#D97706" stroke-width="0.8" opacity="0.6"/>

    <!-- Pen Tip Sparkle / Gleam -->
    <circle cx="0" cy="94" r="2.5" fill="#FFFFFF" filter="url(#goldGlow)"/>
  </g>

  <!-- Typography: MIDAD (English) & مداد (Arabic) -->
  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="6">MIDAD</text>
  <text x="200" y="362" text-anchor="middle" font-family="'Cairo', 'Amiri', 'Traditional Arabic', serif" font-weight="700" font-size="16" fill="#F59E0B" letter-spacing="2">مِـــــداد</text>
</svg>
